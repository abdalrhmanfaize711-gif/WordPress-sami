name: Validate project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check PHP syntax
        run: php -l wordpress/wp-content/plugins/yemen-travel-site/yemen-travel-site.php
      - name: Check JavaScript syntax
        run: node --check wordpress/wp-content/plugins/yemen-travel-site/assets/site.js
      - name: Check Laragon setup scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/install-laragon.ps1', 'scripts/start-laragon-strapi.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Validate project structure and content
        run: node scripts/validate-project.mjs
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config -q

  strapi-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strapi
    env:
      NODE_ENV: production
      APP_KEYS: ci-app-key-one,ci-app-key-two
      API_TOKEN_SALT: ci-api-token-salt-12345678901234567890
      ADMIN_JWT_SECRET: ci-admin-jwt-secret-12345678901234567890
      TRANSFER_TOKEN_SALT: ci-transfer-token-salt-12345678901234567890
      JWT_SECRET: ci-jwt-secret-12345678901234567890
      ENCRYPTION_KEY: ci-encryption-key-1234567890123456
      DATABASE_CLIENT: mysql
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Strapi dependencies
        run: npm install --package-lock=false
      - name: Build the Strapi admin panel
        run: npm run build

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the complete local stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for WordPress and Strapi, then check the plugin file
        run: |
          curl --fail --location --retry 30 --retry-all-errors --retry-delay 3 --retry-max-time 120 http://localhost:8080/ -o /dev/null
          curl --fail --location --retry 30 --retry-all-errors --retry-delay 3 --retry-max-time 120 http://localhost:1337/admin -o /dev/null
          docker compose exec -T wordpress php -l /var/www/html/wp-content/plugins/yemen-travel-site/yemen-travel-site.php
      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the test stack
        if: always()
        run: docker compose down -v

